name: Playwright Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Check Turso test credentials
        run: |
          test -n "$TURSO_DATABASE_URL" || (echo "Set the TURSO_DATABASE_URL repository secret to run signup integration tests." && exit 1)
          test -n "$TURSO_AUTH_TOKEN" || (echo "Set the TURSO_AUTH_TOKEN repository secret to run signup integration tests." && exit 1)

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: node_modules/.cache/playwright-report/
          retention-days: 30
          if-no-files-found: warn
